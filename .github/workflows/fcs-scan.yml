name: FCS CLI IaC Scan on PR

on:
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'terraform/**'
      - 'cloudformation/**'
      - 'k8s/**'
      - '*.yaml'
      - '*.yml'
      - '*.tf'
      - '*.json'

jobs:
  iac-scan:
    name: IaC Scan with FCS CLI
    runs-on: ubuntu-latest

    steps:
      # 1. ソースコードをチェックアウト
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. FCS CLI をダウンロード
      - name: Download FCS CLI
        env:
          FALCON_CLIENT_ID: ${{ secrets.FALCON_CLIENT_ID }}
          FALCON_CLIENT_SECRET: ${{ secrets.FALCON_CLIENT_SECRET }}
          FALCON_API_URL: ${{ secrets.FALCON_API_URL }}
        run: |
          # 認証トークンを取得
          echo "=== Getting auth token ==="
          FALCON_ACCESS_TOKEN=$(curl --silent --request POST \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${FALCON_CLIENT_ID}" \
            --data-urlencode "client_secret=${FALCON_CLIENT_SECRET}" \
            --url "${FALCON_API_URL}/oauth2/token" | jq -r '.access_token')
          echo "Token acquired: $([ -n "$FALCON_ACCESS_TOKEN" ] && echo 'yes' || echo 'no')"

          # Linux x86_64 向け FCS CLI の最新バージョンを取得
          echo "=== Querying available FCS CLI versions ==="
          API_RESPONSE=$(curl --silent --get \
            --header 'accept: application/json' \
            --header "Authorization: Bearer ${FALCON_ACCESS_TOKEN}" \
            --url "${FALCON_API_URL}/csdownloads/combined/files-download/v2" \
            --data-urlencode 'filter=category:"fcs"+os:"linux"+arch:"amd64"')
          echo "Available files:"
          echo $API_RESPONSE | jq -r '.resources[] | "\(.file_version)\t\(.file_name)"' 2>/dev/null

          # 最新バージョン（最後のエントリ）を取得
          DOWNLOAD_URL=$(echo $API_RESPONSE | jq -r '.resources[-1].download_info.download_url')
          FILE_NAME=$(echo $API_RESPONSE | jq -r '.resources[-1].file_name')
          echo "Downloading: ${FILE_NAME}"

          curl --silent --location --output fcs.tar.gz "${DOWNLOAD_URL}"
          echo "Downloaded: $(ls -lh fcs.tar.gz | awk '{print $5}')"

          # tar.gz を展開してバイナリをインストール
          tar -xzf fcs.tar.gz
          chmod u+x fcs
          sudo mv fcs /usr/local/bin/fcs
          echo "FCS CLI installed:"
          fcs version

      # 3. FCS CLI で IaC スキャン実行
      - name: Scan IaC with FCS CLI
        env:
          FALCON_CLIENT_ID: ${{ secrets.FALCON_CLIENT_ID }}
          FALCON_CLIENT_SECRET: ${{ secrets.FALCON_CLIENT_SECRET }}
          FALCON_CLOUD: ${{ secrets.FALCON_CLOUD }}
        run: |
          echo "=== Starting IaC scan ==="
          # リポジトリ全体をスキャン（カレントディレクトリ）
          fcs iac scan \
            --client-id "${FALCON_CLIENT_ID}" \
            --client-secret "${FALCON_CLIENT_SECRET}" \
            --falcon-region "${FALCON_CLOUD}" \
            -p . \
            --upload-results || SCAN_EXIT=$?

          SCAN_EXIT=${SCAN_EXIT:-0}
          echo "Scan exit code: ${SCAN_EXIT}"

          # exit code の意味:
          # 0: 問題なし
          # 1: 問題あり（ブロック推奨）
          # 2: 問題あり（アラート推奨）
          if [ "${SCAN_EXIT}" -eq 0 ]; then
            echo "✅ IaC scan passed - no issues found"
          elif [ "${SCAN_EXIT}" -eq 1 ]; then
            echo "❌ IaC scan failed - blocking issues found"
            exit 1
          elif [ "${SCAN_EXIT}" -eq 2 ]; then
            echo "⚠️  IaC scan warning - issues found (alert level)"
            # warningはブロックしない場合はexitしない
            # exit 0
          else
            echo "IaC scan completed with exit code: ${SCAN_EXIT}"
          fi

